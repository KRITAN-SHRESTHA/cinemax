name: cinemax
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  auto_route: ^11.1.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  pinput: ^6.0.2
  animations: ^3.0.0
  flutter_rating_bar: ^4.0.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.6.0
  build_runner: ^2.15.1
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
          weight: 600
